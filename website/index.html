<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Leave your contact for the Pill Pal team."
    />
    <title>Leave Contact | Pill Pal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="contact-page" aria-labelledby="contact-title">
      <section class="contact-card">
        <div class="card-top">
          <a class="brand" href="index.html" aria-label="Pill Pal home">
            <span class="brand-mark">P</span>
            <span>
              <strong>Pill Pal</strong>
              <small>Contact list</small>
            </span>
          </a>
          <span class="status-pill">Early access</span>
        </div>

        <div>
          <p class="eyebrow">Stay connected</p>
          <h1 id="contact-title">Join the Pill Pal list.</h1>
          <p class="intro-text">
            Add your name and the best way to reach you. We will follow up with updates.
          </p>
        </div>

        <form
          class="contact-form"
          action="https://formsubmit.co/ishaq.bheesha@gmail.com"
          method="POST"
        >
          <input type="hidden" name="_subject" value="New Pill Pal contact" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_captcha" value="false" />
          <input
            type="hidden"
            name="_next"
            value="https://ameer-sys.github.io/About-Pill-Pal/thanks.html"
          />
          <label>
            Name
            <input name="Name" type="text" autocomplete="name" placeholder="Your name" required />
          </label>
          <label>
            Email, phone, or LinkedIn
            <input
              name="Contact"
              type="text"
              autocomplete="email"
              placeholder="Email, phone number, or LinkedIn"
              required
            />
          </label>
          <button class="button primary" type="submit">Send my contact</button>
        </form>
      </section>
    </main>
  </body>
</html>
